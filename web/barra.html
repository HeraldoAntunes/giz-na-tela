<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --fundo: #ffffff; --borda: #e3e6ea; --texto: #2b2f36; --suave: #6b7280; --realce: #1e6fd9;
          --realce-fundo: #e8f1fd; --fixar: #f5b400; --fim: #d93025; }
  html, body { margin: 0; background: transparent; font: 11px "Segoe UI", sans-serif; color: var(--texto);
               user-select: none; overflow: hidden; }
  /* numa tela baixa a janela da barra encolhe (o host decide) e a barra rola, sem esconder Desfazer, Salvar e o X */
  .painel { max-height: calc(100vh - 16px); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .painel { width: 112px; margin: 8px auto; padding: 6px 0 8px; background: var(--fundo); border: 1px solid var(--borda);
            border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: flex; flex-direction: column;
            align-items: center; gap: 4px; }
  .alca { width: 100%; height: 16px; display: grid; place-items: center; cursor: grab; }
  .alca svg { pointer-events: none; }
  .sep { width: 84px; height: 1px; background: var(--borda); margin: 3px 0; }
  .grade { display: grid; grid-template-columns: repeat(3, 30px); gap: 4px; }
  .bt { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--texto);
        display: grid; place-items: center; cursor: pointer; padding: 0; }
  .bt:hover { background: #f1f3f5; }
  .bt.ativo { background: var(--realce-fundo); color: var(--realce); box-shadow: inset 0 0 0 2px var(--realce); }
  .bt svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
            stroke-linejoin: round; }
  /* o botão de modo diz em palavras o modo de AGORA: azul escrevendo, amarelo com o mouse livre */
  .bt.fixar { width: 98px; height: 36px; grid-template-columns: 18px auto; gap: 5px; justify-content: center;
              background: var(--realce-fundo); color: var(--realce); box-shadow: inset 0 0 0 2px var(--realce); }
  .bt.fixar span { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .bt.fixar.ligado { background: var(--fixar); color: #3d2c00; box-shadow: none; }
  .bt.fixar .ic-mouse, .bt.fixar.ligado .ic-caneta { display: none; }
  .bt.fixar.ligado .ic-mouse { display: block; }
  .alca { position: relative; }
  .recolher { position: absolute; right: 8px; top: -2px; width: 20px; height: 20px; border: 0; border-radius: 6px;
              background: none; color: var(--suave); cursor: pointer; padding: 0; display: grid; place-items: center; }
  .recolher:hover { background: #f1f3f5; color: var(--texto); }
  .recolher svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  /* recolhida: só o giz verde, pequeno; um clique abre a barra de novo */
  #abrir { display: none; width: 44px; height: 44px; margin: 6px; border: 0; border-radius: 50%; cursor: pointer; padding: 0;
           background: #1f6b45; box-shadow: 0 3px 10px rgba(0,0,0,.3); place-items: center; }
  #abrir svg { width: 26px; height: 26px; }
  body.recolhido .painel { display: none; }
  body.recolhido #abrir { display: grid; }
  .bt.fim { color: var(--fim); }
  .bt.fim:hover { background: #fdecea; }
  /* X de Fim com desenho na tela: o primeiro toque arma, o segundo (em 3 s) fecha */
  .bt.fim.armado, .bt.fim.armado:hover { background: var(--fim); color: #fff; }
  .ajuda { position: absolute; left: 8px; top: -2px; width: 20px; height: 20px; border: 0; border-radius: 6px;
           background: none; color: var(--suave); cursor: pointer; padding: 0; font: 700 12px "Segoe UI", sans-serif; }
  .ajuda:hover { background: #f1f3f5; color: var(--texto); }
  .bt.opc.ligado { background: var(--realce-fundo); color: var(--realce); }
  .bt.quadro.branco { background: #ffffff; box-shadow: inset 0 0 0 2px var(--realce); color: var(--realce); }
  .bt.quadro.negro { background: #1d2b24; color: #ffffff; }
  .cor { width: 24px; height: 24px; margin: 3px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); cursor: pointer; padding: 0; }
  .cor.ativo { box-shadow: 0 0 0 2px var(--fundo), 0 0 0 4px var(--realce); }
  .ponto { background: currentColor; border-radius: 50%; }
  .ponto.fino { width: 5px; height: 5px; } .ponto.medio { width: 9px; height: 9px; } .ponto.grosso { width: 14px; height: 14px; }
  /* tamanhos aqui e cores das bolinhas pelo script (o professor troca as cores): a política de segurança (CSP) do
     programa bloqueia style="" escrito direto nos elementos */
  .ocupado { opacity: .5; pointer-events: none; }
  .oculto { display: none !important; }
  /* canetas prontas: o desenho mostra a cor e a grossura (bolinha) ou o marca-texto (faixa translúcida) */
  .pena { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; cursor: pointer; padding: 0;
          display: grid; place-items: center; }
  .pena:hover { background: #f1f3f5; }
  .pena.ativo { background: var(--realce-fundo); box-shadow: inset 0 0 0 2px var(--realce); }
  .pena svg { width: 24px; height: 24px; }
  .rotulo { font-size: 10px; color: var(--suave); margin: -2px 0 -1px; }
  body.fixado .desenho { opacity: .45; }
</style>
</head>
<body>

    <button class="recolher" id="recolher" data-cmd="barra.recolher" data-args='{"recolhida":true}' title="Recolher a barra (O): vira um botão pequeno; o mouse fica livre e a tinta continua na tela">

    <svg width="20" height="8" viewBox="0 0 20 8"><g fill="#9aa1ab"><circle cx="4" cy="2" r="1.4"/><circle cx="10" cy="2" r="1.4"/><circle cx="16" cy="2" r="1.4"/><circle cx="4" cy="6" r="1.4"/><circle cx="10" cy="6" r="1.4"/><circle cx="16" cy="6" r="1.4"/></g></svg>

  <button class="bt fixar" id="fixar" data-cmd="tela.fixar" title="Escrevendo. Toque (ou F) para soltar o mouse para os outros programas; a tinta fica na tela">

    </button>
    <button class="bt ferr" data-cmd="ferramenta.escolher" data-args='{"ferramenta":"marca"}' title="Marca-texto (M; Shift: traço reto)">

    <button class="bt ferr" data-cmd="ferramenta.escolher" data-args='{"ferramenta":"borracha"}' title="Borracha (B)">

    </button>
    <button class="bt ferr" data-cmd="ferramenta.escolher" data-args='{"ferramenta":"mover"}' title="Mover (Espaço): toque num objeto e arraste (Ctrl+Z desfaz)">

    <button class="bt opc" id="preencher" data-cmd="forma.preencher" title="Preenchimento do retângulo e da elipse (P): só contorno">

    </button>
    <button class="bt oculto" id="btTela" data-cmd="tela.escolher" title="Outra tela (Y)">

    <button class="cor" data-cmd="cor.posicao" data-args='{"posicao":3}' title="Cor 3"></button>
    <button class="cor" data-cmd="cor.posicao" data-args='{"posicao":4}' title="Cor 4"></button>
    <button class="cor" data-cmd="cor.posicao" data-args='{"posicao":5}' title="Cor 5"></button>

      <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>

    <button class="bt" id="salvar" data-cmd="captura.salvar" title="Salvar a tela com a tinta como imagem (Ctrl+S), em Documentos\Giz Livre\capturas">

      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 19v-7M9 15l3-3 3 3"/></svg>
    </button>
    <button class="bt fim" id="fim" title="Fechar o anotador (os desenhos se perdem)">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>

</div>
<button id="abrir" title="Toque para abrir a barra (volta a escrever); arraste para mudar de lugar">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="#fff" stroke-width="1.8"/>
    <path d="M7 12.5c2-2.5 4-3 6-1.5s3 .5 4-1.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M9 20h6M12 16v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>
<script src="comandos.js"></script>
<script>
// A barra guarda o estado e executa os comandos do registro (comandos.js). Botão, atalho, Esc, Ctrl+Alt+F e pedido de
// fora (API e MCP) entram por executar(); a camada só desenha e devolve o estado dela depois de cada pedido.
const { POR_NOME, ATALHOS, ESPESSURAS, COMANDOS, DE_NOVO, COTAS, CORES, CANETAS, BOTAO_DA_CANETA, validar } = window.GizTela;
const CORES_DE_FABRICA = CORES.map(c => c[0]);
const ponte = window.ponte, $ = id => document.getElementById(id);
const S = { cores: [...CORES_DE_FABRICA], escala: null, ultimaMedida: null, ferramenta: 'caneta', cor: CORES_DE_FABRICA[0], espessura: 'media', quadro: 'tela', preencher: 'nada', seta: 'aberta', setaDupla: false, cota: 'setas', some: false,
  fixado: false, recolhido: false, congelado: false, ampliado: false, tracos: 0, desfazer: false, refazer: false,
  largura: 0, altura: 0, canetas: CANETAS.map(c => ({ ...c })), botaoCaneta: 'nada', tela: 1, telas: [], selecionados: 0, pena: 0 };
const QUADROS = ['tela', 'branco', 'negro'], PREENCHER = ['nada', 'translucido', 'cheio'];
// cor clara (amarelo, branco) ganha contorno mais suave no desenho da caneta pronta
function claro(cor) { const n = parseInt(cor.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255) > 170; }
const proximo = (lista, atual) => lista[(lista.indexOf(atual) + 1) % lista.length];
async function camada(nome, valor) {
  const e = await ponte.camada(nome, valor ?? null);
  if (e && typeof e === 'object') Object.assign(S, e);
  render();   // quem pediu recebe o estado público (estadoPublico), não o interno da camada
}
const aviso = msg => ponte.camada('aviso', msg);
window.estadoCamada = e => { Object.assign(S, e); render(); };
function lerTelas(t) { if (t && Array.isArray(t.telas)) { S.telas = t.telas; S.tela = t.atual; render(); } }   // traço feito à mão, tinta que sumiu etc.

async function fixar(sim) {
  if (sim === S.fixado) return;
  S.fixado = await ponte.fixar(sim);
  if (!sim && S.recolhido) { S.recolhido = false; render(); await ponte.recolher(false); }  // voltou a escrever: abre a barra
  render();
}

  $('ampliar').classList.toggle('ligado', S.ampliado);
  const armado = Date.now() - fimArmado < 3000;
  $('fim').classList.toggle('armado', armado);
  $('fim').title = armado ? 'Toque de novo para fechar e apagar os desenhos' : 'Fechar o anotador (os desenhos se perdem)';
}

document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', async () => {
  if (b.classList.contains('ocupado')) return;
  const lento = b.dataset.cmd.startsWith('captura.');   // retratar e mandar ao Giz demoram: o botão espera
  if (lento) b.classList.add('ocupado');
  // segundo toque numa ferramenta já escolhida: troca a opção dela (ex.: ponta da seta)
  const f = argsDe(b).ferramenta, pos = argsDe(b).posicao;
  const outra = b.dataset.cmd === 'ferramenta.escolher' && f === S.ferramenta ? DE_NOVO[f]
    : b.dataset.cmd === 'cor.posicao' && S.cores[pos - 1] === S.cor && !(S.ferramenta === 'laco' && S.selecionados)
      ? ['cor.trocar', { posicao: pos }] : null;
  try { await (outra ? executar(outra[0], outra[1], 'botao') : executar(b.dataset.cmd, argsDe(b), 'botao')); }
  catch (e) { aviso(e.message); }
  finally { b.classList.remove('ocupado'); }
}));
$('fim').onclick = () => executar('programa.fechar', Date.now() - fimArmado < 3000 ? { confirmar: true } : {}, 'botao')
  .catch(e => aviso(e.message));
// o botão recolhido também se arrasta: toque abre; arrastar (mais de 4 px) move, sem abrir
let toque = null;
$('abrir').onpointerdown = e => { toque = { x: e.screenX, y: e.screenY, arrastou: false }; };
$('abrir').onpointermove = e => {
  if (!toque || toque.arrastou || !e.buttons || Math.hypot(e.screenX - toque.x, e.screenY - toque.y) < 4) return;
  toque.arrastou = true;
  window.__TAURI__?.window.getCurrentWindow().startDragging();
};
$('abrir').onclick = () => {
  if (!toque?.arrastou) executar('barra.recolher', { recolhida: false }, 'botao').catch(e => aviso(e.message));
  toque = null;
};
document.addEventListener('keydown', e => {
  if (e.altKey) return;
  const k = (e.ctrlKey ? 'ctrl+' : '') + e.key.toLowerCase();
  if (!ATALHOS[k]) return;
  e.preventDefault(); window.tecla(k);
});
// abriu recolhida (como o professor deixou da última vez): botão pequeno e mouse livre
if (window.CONFIG?.recolhida) { S.recolhido = true; fixar(true); }
render();
// abre com as escolhas da última vez (cor, espessura, tipos de seta e de cota, preenchimento e cores das bolinhas);
// a camada pode ter terminado de abrir antes desta página e o primeiro aviso dela se perdeu: pede o estado de novo
aplicarPreferencias(window.CONFIG?.preferencias).catch(() => {}).finally(() => camada('estado').catch(() => {}));
// a tinta é guardada por tela; o botão de tela só aparece com mais de uma ligada (o projetor pode chegar depois)
ponte?.telas().then(t => { lerTelas(t); S.chaveTela = S.telas[S.tela - 1]?.nome ?? 'tela 1'; return camada('tela', S.chaveTela); }).catch(() => {});
setInterval(() => ponte?.telas().then(t => {
  lerTelas(t);
  const nome = S.telas[S.tela - 1]?.nome;
  if (S.chaveTela && nome && nome !== S.chaveTela) executar('tela.escolher', { tela: S.tela }, 'atalho').catch(() => {});
}).catch(() => {}), 3000);
</script>
