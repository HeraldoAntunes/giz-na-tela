<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #palco { position: fixed; inset: 0; transform-origin: 0 0; }
  #c { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; touch-action: none; }
  #congelado { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: none; }
  /* sem nada desenhado o fundo precisa ser quase invisível mas "pegar" a caneta: alfa 1/255 */
  body.escrevendo { background: rgba(0, 0, 0, 0.004); }
  #escrita { position: absolute; min-width: 40px; padding: 0 2px; outline: 1.5px dashed rgba(30,111,217,.8);
             outline-offset: 3px; white-space: pre; font-family: "Segoe UI", sans-serif; font-weight: 600;
             line-height: 1.2; background: rgba(255,255,255,.01); caret-color: currentColor; }
  #escrita.medida:empty::before { content: 'medida (ou Enter)'; opacity: .45; font-weight: 400; }
  #fundo { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: none; }
  #lupa { position: fixed; width: 240px; height: 240px; border-radius: 50%; pointer-events: none; display: none;
          box-shadow: 0 0 0 3px #fff, 0 0 0 4px #333, 0 8px 22px rgba(0,0,0,.45); background: #fff; }
  #aviso { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); max-width: 70vw; display: none;
           font: 15px "Segoe UI", sans-serif; color: #fff; background: rgba(32,33,36,.92); padding: 10px 16px;
           border-radius: 10px; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  #luz { position: fixed; inset: 0; pointer-events: none; display: none; }
  /* o que o laço pegou: um botão de apagar e a dica do que mais dá para fazer, logo acima do grupo */
  #selMenu { position: absolute; display: none; transform: translateY(-100%); margin-top: -8px; gap: 8px; align-items: center;
             font: 13px "Segoe UI", sans-serif; color: #fff; background: rgba(32,33,36,.92); padding: 5px 6px 5px 10px;
             border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,.3); white-space: nowrap; }
  #selMenu button { border: 0; border-radius: 6px; background: #d93025; color: #fff; font: 600 13px "Segoe UI", sans-serif;
                    padding: 4px 10px; cursor: pointer; }
  #selMenu.embaixo { transform: none; margin-top: 8px; }
</style>
</head>
<body class="escrevendo">
<div id="palco"><img id="congelado" alt=""><div id="fundo"></div><canvas id="c"></canvas>
  <div id="selMenu"><span id="selQuantos"></span><button id="selApagar" title="Apagar o que o laço pegou (Delete)">Apagar</button></div></div>
<div id="luz"></div>
<canvas id="lupa"></canvas>
<div id="aviso"></div>
<script>
// Desenho com pressão por PointerEvents. A camada só desenha: quem decide é a barra (registro de comandos), que chama
// as funções de window.camada pelo host e recebe de volta o estado daqui.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = { escala: null, cor: '#2e9d4a', largura: 4, ferramenta: 'caneta', borracha: false, tracos: [], atual: null, seta: 'aberta', setaDupla: false, cota: 'setas',
            passado: [], futuro: [], some: false, preencher: 'nada', raioLuz: 160, aumento: 2.5,
            botaoCaneta: 'nada', temporaria: null, lateral: false, laco: null, chaveTela: null };
// o laço guarda os próprios objetos escolhidos (eles nunca mudam: mover ou pintar troca por outros)
let sel = new Set();
// desfazer e refazer guardam a lista inteira antes de cada mudança (os itens nunca mudam depois de prontos)
function guardar() { S.passado.push(S.tracos); if (S.passado.length > 300) S.passado.shift(); S.futuro = []; }
function acrescentar(t) {
  guardar();
  if (S.some && !t.borracha) t.ate = performance.now() + SOME_MS;
  S.tracos = [...S.tracos, t];
  if (t.ate) animarSumico();
  avisarBarra();
}
// tinta que some: fica inteira por 2,3 s e se apaga em 0,7 s
const SOME_MS = 3000, APAGAR_MS = 700;
const alfa = t => (t.ate ? Math.min(1, Math.max(0, (t.ate - performance.now()) / APAGAR_MS)) : 1);
const vivos = lista => lista.filter(t => !t.ate || t.ate > performance.now());
let sumindo = false;
function animarSumico() {
  if (sumindo) return;
  sumindo = true;
  const passo = () => {
    const agora = performance.now();
    if (!S.tracos.some(t => t.ate)) { sumindo = false; return; }
    if (S.tracos.some(t => t.ate && t.ate - agora < APAGAR_MS)) {
      const antes = S.tracos.length;
      if (!movendo) S.tracos = vivos(S.tracos);   // durante o arrasto, só apaga; sai da lista ao soltar
      if (S.tracos.length !== antes) avisarBarra();
      redesenhar();
      if (S.atual) { desenharTraco(S.atual); if (S.atual.pts) S.atual.feitos = S.atual.pts.length; }
    }
    requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}
// ampliar: o palco (retrato congelado, quadro e tinta) recebe escala e deslocamento; a tinta guarda coordenadas
// da tela sem ampliação, então continua no lugar certo quando a ampliação volta a 1
const V = { z: 1, ox: 0, oy: 0 }, palco = document.getElementById('palco');
const W = e => ({ x: (e.clientX - V.ox) / V.z, y: (e.clientY - V.oy) / V.z });
function ampliarEm(sx, sy, z) {   // o ponto (sx, sy) da tela fica parado enquanto a escala muda
  z = Math.min(6, Math.max(1, z));
  const wx = (sx - V.ox) / V.z, wy = (sy - V.oy) / V.z;
  V.z = z; V.ox = Math.min(0, Math.max(innerWidth * (1 - z), sx - wx * z));
  V.oy = Math.min(0, Math.max(innerHeight * (1 - z), sy - wy * z));
  palco.style.transform = `translate(${V.ox}px, ${V.oy}px) scale(${V.z})`;
}
function ajustar() {
  const r = devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); redesenhar();
}
addEventListener('resize', () => { ajustar(); avisarBarra(); });   // outra tela: outro tamanho
// pressão 0 é a caneta encostando de leve (traço fino); sem pressão nenhuma (item de agente), o meio
function largura(p, t) { return t.borracha ? 28 : t.largura * (0.35 + 1.3 * (p.p ?? 0.5)); }
// letra grande o bastante para ler do fundo da sala; espessura fina/média/grossa = 22/30/46 px
const tamTexto = largura => 14 + largura * 4;
const raioNumero = largura => 10 + largura * 2;
function claro(cor) {
  const n = parseInt(cor.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b > 170;
}
function desenharTexto(t) {
  ctx.save(); ctx.font = `600 ${t.tam}px "Segoe UI", sans-serif`; ctx.textBaseline = 'top';
  // contorno leve na cor oposta: o texto continua legível sobre qualquer coisa que esteja embaixo
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, t.tam / 9);
  ctx.strokeStyle = claro(t.cor) ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.7)'; ctx.fillStyle = t.cor;
  t.texto.split('\n').forEach((linha, i) => {
    const y = t.y + i * t.tam * 1.2;
    ctx.strokeText(linha, t.x, y); ctx.fillText(linha, t.x, y);
  });
  ctx.restore();
}
function desenharNumero(t) {
  ctx.save(); ctx.fillStyle = t.cor; ctx.strokeStyle = claro(t.cor) ? '#333' : '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(t.x, t.y, t.raio, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = claro(t.cor) ? '#111' : '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(t.raio * (t.n > 9 ? 1.05 : 1.25))}px "Segoe UI", sans-serif`;
  ctx.fillText(String(t.n), t.x, t.y + t.raio * 0.06);
  ctx.restore();
}
// visto e X de correção, carimbados com um toque
const tamMarca = largura => 24 + largura * 6;
function desenharCorrecao(t) {
  const s = t.tam;
  ctx.save(); ctx.strokeStyle = t.cor; ctx.lineWidth = Math.max(3, s * 0.16); ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  if (t.correcao === 'visto') { ctx.moveTo(t.x - s * 0.45, t.y); ctx.lineTo(t.x - s * 0.12, t.y + s * 0.35); ctx.lineTo(t.x + s * 0.5, t.y - s * 0.4); }
  else { ctx.moveTo(t.x - s * 0.38, t.y - s * 0.38); ctx.lineTo(t.x + s * 0.38, t.y + s * 0.38); ctx.moveTo(t.x + s * 0.38, t.y - s * 0.38); ctx.lineTo(t.x - s * 0.38, t.y + s * 0.38); }
  ctx.stroke(); ctx.restore();
}
function desenharTraco(t) {
  if (t.forma) { desenharForma(t); return; }
  if (t.correcao) { desenharCorrecao(t); return; }
  if (t.texto !== undefined) { desenharTexto(t); return; }
  if (t.n) { desenharNumero(t); return; }
  if (t.marca) {   // marca-texto: um caminho só, translúcido, para as emendas não escurecerem
    ctx.save(); ctx.globalAlpha *= 0.35; ctx.strokeStyle = t.cor; ctx.lineWidth = t.largura * 4;
    ctx.lineCap = ctx.lineJoin = 'round'; ctx.beginPath();
    t.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    if (t.pts.length === 1) ctx.lineTo(t.pts[0].x + 0.01, t.pts[0].y);   // um toque: a ponta redonda vira o ponto
    ctx.stroke(); ctx.restore(); return;
  }
  ctx.globalCompositeOperation = t.borracha ? 'destination-out' : 'source-over';
  ctx.strokeStyle = t.cor; ctx.lineCap = ctx.lineJoin = 'round';
  if (t.pts.length === 1) {   // toque sem arrastar: um ponto do tamanho da ponta
    const p = t.pts[0];
    ctx.fillStyle = t.cor; ctx.beginPath(); ctx.arc(p.x, p.y, largura(p, t) / 2, 0, 2 * Math.PI); ctx.fill();
  }
  for (let i = 1; i < t.pts.length; i++) {
    const a = t.pts[i - 1], b = t.pts[i];
    ctx.lineWidth = largura(b, t); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
// formas: arrastar da ponta inicial até a final; Shift prende a reta em 15 graus e a caixa em quadrado
const FORMAS = new Set(['reta', 'seta', 'cota', 'medir', 'retangulo', 'elipse']);
function pontaFinal(a, e, forma) {
  const { x, y } = W(e);
  if (!e.shiftKey) return { x, y };
  const dx = x - a.x, dy = y - a.y;
  if (forma === 'reta' || forma === 'seta' || forma === 'cota' || forma === 'medir') {
    const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 12)) * (Math.PI / 12), r = Math.hypot(dx, dy);
    return { x: a.x + r * Math.cos(ang), y: a.y + r * Math.sin(ang) };
  }
  const lado = Math.max(Math.abs(dx), Math.abs(dy));
  return { x: a.x + Math.sign(dx || 1) * lado, y: a.y + Math.sign(dy || 1) * lado };
}
function desenharForma(t) {
  const { a, b } = t;
  ctx.save(); ctx.strokeStyle = ctx.fillStyle = t.cor; ctx.lineWidth = t.largura; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  if (t.forma === 'retangulo') ctx.rect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
  else if (t.forma === 'elipse') ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, 2 * Math.PI);
  if (t.forma === 'retangulo' || t.forma === 'elipse') {
    if (t.preencher === 'cheio' || t.preencher === 'translucido') {
      // cheio tapa o que está embaixo (ex.: a resposta); translúcido só destaca
      const g = ctx.globalAlpha; if (t.preencher === 'translucido') ctx.globalAlpha = g * 0.3;
      ctx.fill(); ctx.globalAlpha = g;
    }
  }
  else if (t.forma === 'seta') { desenharSeta(t); ctx.restore(); return; }
  else if (t.forma === 'cota') { desenharCota(t); ctx.restore(); return; }

  ctx.stroke(); ctx.restore();
}
// seta: haste um quarto mais fina que o traço escolhido e ponta grande o bastante para ler de longe.
// Aberta (em V, a de fábrica) ou cheia (triângulo). Seta antiga, sem `ponta`, era cheia.
// ponta em `p`, apontando no ângulo `ang`; devolve quanto a haste precisa recuar para não aparecer na ponta cheia
function ponta(p, ang, cab, cheia) {
  const abre = cheia ? 0.4 : 0.48;
  ctx.beginPath();
  ctx.moveTo(p.x - cab * Math.cos(ang - abre), p.y - cab * Math.sin(ang - abre));
  ctx.lineTo(p.x, p.y);
  ctx.lineTo(p.x - cab * Math.cos(ang + abre), p.y - cab * Math.sin(ang + abre));
  if (cheia) { ctx.closePath(); ctx.fill(); } else ctx.stroke();
  return cheia ? cab * 0.7 : 0;
}
function linhaRecuada(a, b, recA, recB) {
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.beginPath();
  ctx.moveTo(a.x + Math.cos(ang) * recA, a.y + Math.sin(ang) * recA);
  ctx.lineTo(b.x - Math.cos(ang) * recB, b.y - Math.sin(ang) * recB);
  ctx.stroke();
}
function desenharSeta(t) {
  const { a, b } = t, ang = Math.atan2(b.y - a.y, b.x - a.x), w = Math.max(1.5, t.largura * 0.75);
  const cheia = (t.ponta || 'cheia') === 'cheia', cab = Math.max(16, w * (cheia ? 4.5 : 5));
  ctx.lineWidth = w;
  const recB = ponta(b, ang, cab, cheia), recA = t.dupla ? ponta(a, ang + Math.PI, cab, cheia) : 0;
  linhaRecuada(a, b, recA, recB);

// cota: linha fina com barras perpendiculares nas pontas; setas (cheias, pequenas) até as barras, ou tracinhos
// inclinados (arquitetura); a medida, se houver, entra no meio da linha, sempre de pé para ler
const tamMedida = t => Math.max(18, Math.round(tamTexto(t.largura) * 0.75));
// cota automática: sem régua mede em px da tela; com régua, na unidade dela. A régua se define sozinha quando o
// professor digita uma medida com unidade (ex.: 10 cm) numa cota com medida desenhada sobre algo de tamanho conhecido
const numero = v => v.toLocaleString('pt-BR', { maximumFractionDigits: v >= 100 ? 0 : v >= 10 ? 1 : 2 });
function medirCota(t) {
  const px = Math.hypot(t.b.x - t.a.x, t.b.y - t.a.y);
  return S.escala ? `${numero(px * S.escala.valor / S.escala.px)} ${S.escala.unidade}` : `${Math.round(px)} px`;
}
function definirRegua(t, texto) {
  const m = /^(\d+(?:[.,]\d+)?)\s*(mm|cm|m|km)$/i.exec(texto), px = Math.hypot(t.b.x - t.a.x, t.b.y - t.a.y);
  if (!m || px < 4) return;
  S.escala = { valor: Number(m[1].replace(',', '.')), unidade: m[2].toLowerCase(), px };
  if (!(S.escala.valor > 0)) { S.escala = null; return; }
  camada.aviso(`Régua definida: ${texto} = ${Math.round(px)} px. A cota automática passa a medir em ${S.escala.unidade}.`);
}
function desenharCota(t) {
  const { a, b } = t, ang = Math.atan2(b.y - a.y, b.x - a.x), w = Math.max(1.5, t.largura * 0.6);

  ctx.lineWidth = w;
  for (const p of [a, b]) {
    ctx.beginPath(); ctx.moveTo(p.x - nx * barra, p.y - ny * barra); ctx.lineTo(p.x + nx * barra, p.y + ny * barra); ctx.stroke();
  }

    ctx.save(); ctx.lineWidth = w * 1.8;
    for (const p of [a, b]) {
      ctx.beginPath(); ctx.moveTo(p.x - Math.cos(inclina) * d, p.y - Math.sin(inclina) * d);
      ctx.lineTo(p.x + Math.cos(inclina) * d, p.y + Math.sin(inclina) * d); ctx.stroke();

// o ponteiro do mouse e da caneta: caneta na cor escolhida (ponta embaixo à esquerda), marca-texto e borracha
function cursorSvg(svg, x, y) { return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${x} ${y}, crosshair`; }
function atualizarCursor() {

  else if (f === 'lupa') cur = 'none';
  else if (f === 'holofote') cur = 'crosshair';
  else if (f === 'mover') cur = movendo ? 'grabbing' : 'grab';
  else if (f === 'laco') cur = movendo ? 'grabbing' : 'crosshair';
  else if (f === 'visto' || f === 'xis') {

    cur = cursorSvg(`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><path d="${d}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`, 14, 14);
  }

  else if (f === 'marca') cur = cursorSvg(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><path d="M2 30l3-9 6 6z" fill="${c}" stroke="#222" stroke-width="1" stroke-linejoin="round"/><path d="M5 21L21 5l6 6-16 16z" fill="#fff" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/><path d="M21 5l3-3 6 6-3 3z" fill="${c}" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/></svg>`, 2, 30);
  else cur = cursorSvg(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><path d="M2 30l2-7 5 5z" fill="${c}" stroke="#222" stroke-width="1" stroke-linejoin="round"/><path d="M4 23L22 5l5 5L9 28z" fill="#fff" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/><path d="M22 5l3-3 5 5-3 3z" fill="${c}" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/>${FORMAS.has(f) ? '<path d="M24 20v8M20 24h8" stroke="#222" stroke-width="1.6"/>' : ''}</svg>`, 2, 30);

function redesenhar() {

// ---- o laço: contorna objetos; o grupo escolhido se arrasta, se pinta (bolinha de cor) ou se apaga (Delete) ----

  movendo = { originais: new Map([[i, S.tracos[i]]]), de: p, mexeu: false, futuro };
  atualizarCursor();
}
function pegarGrupo(p) {
  const futuro = S.futuro;
  guardar();
  movendo = { originais: new Map(S.tracos.map((t, j) => [j, t]).filter(([, t]) => sel.has(t))), de: p, mexeu: false, grupo: true, futuro };
  atualizarCursor(); redesenhar();
}
function arrastar(p) {
  const dx = p.x - movendo.de.x, dy = p.y - movendo.de.y;
  if (!movendo.mexeu && Math.hypot(dx, dy) < 2) return;
  movendo.mexeu = true;
  S.tracos = S.tracos.map((t, j) => (movendo.originais.has(j) ? deslocar(movendo.originais.get(j), dx, dy) : t));
  pedirQuadroMover();
}
let quadroMover = false;
function pedirQuadroMover() {
  if (quadroMover) return;
  quadroMover = true;
  requestAnimationFrame(() => { quadroMover = false; redesenhar(); });
}
function soltar() {
  if (!movendo.mexeu) { S.passado.pop(); S.futuro = movendo.futuro; }   // só um toque: nem Desfazer nem Refazer mudam
  if (movendo.grupo) sel = new Set([...movendo.originais.keys()].map(j => S.tracos[j]).filter(Boolean));
  movendo = null; redesenhar(); atualizarCursor(); avisarBarra();
}
// mudar os objetos do grupo (mover, pintar) num passo só do Desfazer; o grupo continua escolhido
function mudarSelecao(f) {
  guardar();
  const novos = new Set();
  S.tracos = S.tracos.map(t => { if (!sel.has(t)) return t; const n = f(t); novos.add(n); return n; });
  sel = novos;
}
// a tinta de cada tela fica guardada com ela; voltar à tela traz a tinta de volta
const PAGINAS = {};
// caixa da medida, centrada no meio da cota; Enter termina, Esc deixa a cota sem medida
function abrirMedida(t) {
  const tam = tamMedida(t), el = document.createElement('div');
  el.id = 'escrita'; el.className = 'medida'; el.contentEditable = 'plaintext-only';
  Object.assign(el.style, { left: (t.a.x + t.b.x) / 2 + 'px', top: (t.a.y + t.b.y) / 2 + 'px', fontSize: tam + 'px',
    color: t.cor, transform: 'translate(-50%, -50%)', background: 'rgba(255,255,255,.85)' });
  palco.append(el);
  escrita = { el, cota: t };
  el.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); terminarEscrita(); }
    if (e.key === 'Escape') { e.preventDefault(); terminarEscrita(true); }
  });
  setTimeout(() => el.focus(), 0);
}
// chamadas da barra (pelo host): cada uma devolve o estado daqui, para a barra acender os botões certos
const ESPESSURA = { fina: 2, media: 4, grossa: 8 };
// itens que chegam prontos (comandos texto.escrever, forma.desenhar, desenho.adicionar...), já validados pela barra
function itemDeFora(it, numero) {
  const cor = it.cor || S.cor, larg = it.espessura ? ESPESSURA[it.espessura] : S.largura;
  switch (it.tipo) {
    case 'texto': return { texto: it.texto, x: it.x, y: it.y, tam: it.tamanho || tamTexto(larg), cor };
    case 'numero': return { n: it.numero ?? numero, x: it.x, y: it.y, raio: raioNumero(larg), cor };
    case 'correcao': return { correcao: it.marca, x: it.x, y: it.y, tam: tamMarca(larg), cor };
    case 'forma': return { forma: it.forma, cor, largura: larg, a: { x: it.x1, y: it.y1 }, b: { x: it.x2, y: it.y2 },
      ponta: it.ponta || S.seta, dupla: it.dupla ?? S.setaDupla, cota: it.cota || (it.medida ? 'medida' : S.cota),
      ...(it.medida ? { medida: it.medida } : {}),
      preencher: it.preencher || S.preencher };
    case 'traco': return { cor, largura: larg, marca: !!it.marca, borracha: false,
      pts: it.pontos.map(([x, y, p]) => ({ x, y, p })) };
  }
  throw new Error('item desconhecido: ' + it.tipo);
}
window.camada = {
  estado,
  cor(c) {
    S.cor = c; if (S.ferramenta === 'borracha') S.ferramenta = 'caneta';
    if (escrita) { escrita.cor = c; escrita.el.style.color = c; escrita.el.focus(); }
    atualizarCursor(); return estado();
  },
  async ferramenta(f) {
    terminarEscrita();
    if (f !== 'laco') soltarSelecao();
    S.temporaria = null;
    const antes = S.ferramenta;
    S.ferramenta = f; atualizarCursor();
    luz.style.display = f === 'holofote' ? 'block' : 'none';
    if (f === 'holofote') moverLuz(innerWidth / 2, innerHeight / 2);
    if (f !== 'lupa') lupa.style.display = 'none';
    if (f === 'lupa') await congelar(true, true);   // a lupa trabalha sobre um retrato da tela
    else if (antes === 'lupa' && congeladoSozinho && V.z === 1) await congelar(false);
    return estado();
  },
  async congelar(sim) {
    if (!(await congelar(!!sim))) throw new Error('não consegui retratar a tela');
    return estado();
  },
  // ampliar: true espera o toque no ponto; false volta ao normal; '+' e '-' mudam o aumento no meio da tela
  async ampliar(v) {
    if (v === false) {
      if (S.ferramenta === 'ampliar') S.ferramenta = S.antesDeAmpliar || 'caneta';
      ampliarEm(0, 0, 1); atualizarCursor();
      if (congeladoSozinho) await congelar(false);
      return estado();
    }
    if (!(await congelar(true, congelado.style.display !== 'block'))) throw new Error('não consegui retratar a tela');
    if (v === '+' || v === '-') { ampliarEm(innerWidth / 2, innerHeight / 2, V.z * (v === '+' ? 1.25 : 0.8)); return estado(); }
    if (S.ferramenta !== 'ampliar') S.antesDeAmpliar = S.ferramenta;
    S.ferramenta = 'ampliar'; atualizarCursor();
    return estado();
  },
  aviso(msg) {
    const a = document.getElementById('aviso');
    a.textContent = msg; a.style.display = 'block';
    clearTimeout(a.tempo); a.tempo = setTimeout(() => { a.style.display = 'none'; }, 6000);
    return estado();
  },
  espessura(n) { S.largura = n; atualizarCursor(); return estado(); },
  desfazer() {
    terminarEscrita(true); sel = new Set();
    if (S.passado.length) { S.futuro.push(S.tracos); S.tracos = vivos(S.passado.pop()); redesenhar(); atualizarCursor(); }
    return estado();
  },
  refazer() {
    sel = new Set();
    if (S.futuro.length) { S.passado.push(S.tracos); S.tracos = vivos(S.futuro.pop()); redesenhar(); atualizarCursor(); }
    return estado();
  },
  limpar() { terminarEscrita(true); sel = new Set(); if (S.tracos.length) guardar(); S.tracos = []; redesenhar(); atualizarCursor(); return estado(); },
  // quadro: 'branco' ou 'negro' cobre a tela com um fundo liso; 'tela' volta a mostrar os programas
  quadro(q) {
    const f = document.getElementById('fundo'), liso = q === 'branco' || q === 'negro';
    f.style.display = liso ? 'block' : 'none'; f.style.background = q === 'negro' ? '#1d2b24' : '#ffffff';
    return estado();
  },
  some(sim) { S.some = !!sim; return estado(); },
  seta(v) { S.seta = v?.ponta === 'cheia' ? 'cheia' : 'aberta'; S.setaDupla = !!v?.dupla; return estado(); },
  cota(e) { S.cota = e === 'tracos' ? 'tracos' : 'setas'; return estado(); },
  // objeto.mover (agente ou teste): o mesmo que a mão faz, num passo só
  mover({ x, y, dx, dy }) {
    terminarEscrita();
    const i = deCima({ x, y });
    if (i < 0) throw new Error('não há objeto nesse ponto');
    guardar();
    S.tracos = S.tracos.map((t, j) => (j === i ? deslocar(t, dx, dy) : t));
    redesenhar(); return estado();
  },
  escala(v) { S.escala = v && v.valor > 0 && v.px > 0 ? { valor: v.valor, unidade: v.unidade, px: v.px } : null; redesenhar(); return estado(); },
  preencher(p) { S.preencher = ['translucido', 'cheio'].includes(p) ? p : 'nada'; return estado(); },
  escrevendo(sim) { document.body.classList.toggle('escrevendo', sim); return estado(); },
  botao(acao) { S.botaoCaneta = ['borracha', 'marca', 'reta', 'mover', 'laco'].includes(acao) ? acao : 'nada'; return estado(); },
  // trocou de tela: guarda a tinta (com o Desfazer) da tela de antes e traz a da nova
  tela(chave) {
    chave = String(chave);
    if (S.chaveTela !== null && S.chaveTela !== chave) {
      terminarEscrita(); sel = new Set();
      PAGINAS[S.chaveTela] = { tracos: S.tracos, passado: S.passado, futuro: S.futuro };
      ({ tracos: S.tracos, passado: S.passado, futuro: S.futuro } = PAGINAS[chave] || { tracos: [], passado: [], futuro: [] });
      S.tracos = vivos(S.tracos);   // a tinta que some e venceu enquanto esta tela estava fora não volta
      if (S.tracos.some(t => t.ate)) animarSumico();
      ajustar(); atualizarCursor(); avisarBarra();
    }
    S.chaveTela = chave;
    return estado();
  },
  // o laço: escolher pelo contorno, mover, pintar, apagar ou soltar o grupo
  selecao(v) {
    terminarEscrita();
    if (v.acao === 'laco') escolherNoContorno(v.pontos.map(([x, y]) => ({ x, y })));
    else if (v.acao === 'soltar') sel = new Set();
    else {
      if (!sel.size) throw new Error('nada escolhido: contorne os objetos com o laço primeiro');
      if (v.acao === 'mover') mudarSelecao(t => deslocar(t, v.dx, v.dy));
      else if (v.acao === 'cor') mudarSelecao(t => ({ ...t, cor: v.cor }));
      else if (v.acao === 'apagar') { guardar(); S.tracos = S.tracos.filter(t => !sel.has(t)); sel = new Set(); }
    }
    redesenhar(); atualizarCursor(); return estado();
  },
  // vários itens de uma vez entram como um passo só do Desfazer (é assim que o pedido de um agente se desfaz)
  adicionar(lista) {
    terminarEscrita();
    let numero = proximoNumero();
    const novos = lista.map(it => {
      const t = itemDeFora(it, numero);
      if (t.n) numero = Math.max(numero, t.n + 1);
      if (t.forma === 'cota' && t.cota === 'auto' && !t.medida) t.medida = medirCota(t);
      return t;
    });
    if (novos.length) {
      guardar();
      const ate = S.some ? performance.now() + SOME_MS : 0;
      S.tracos = [...S.tracos, ...novos.map(t => (ate ? { ...t, ate } : t))];
      if (ate) animarSumico();
      redesenhar(); atualizarCursor();
    }
    return estado();
  },
};
// teclas: a barra guarda o estado dos botões, então os atalhos vão para ela (pelo host)
document.addEventListener('keydown', e => {
  if (e.altKey || ['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
  e.preventDefault();
  window.ponte?.tecla((e.ctrlKey ? 'ctrl+' : '') + e.key);
});
ajustar(); atualizarCursor(); avisarBarra();
</script>
