# Dependabot: uma vez por mês, abre um pedido de mudança (pull request) quando sai versão nova das actions ou das
# bibliotecas Rust. Nada é aplicado sozinho: cada pedido só entra se for aceito.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      bibliotecas:
        patterns: ["*"]
