# Fuzzing dos leitores do que vem de fora (cabeçalho HTTP da API local, linha de comando de outro processo, arquivos
# da release): cada alvo da pasta fuzz/ roda 2 minutos com o cargo-fuzz quando esses leitores mudam e toda semana.
# Uma falha deixa o caso que a provocou como artefato, para virar teste de regressão.
name: Fuzzing

on:
  push:
    branches: [main]
    paths: ["src/leitura.rs", "fuzz/**", ".github/workflows/fuzzing.yml"]
  pull_request:
    paths: ["src/leitura.rs", "fuzz/**", ".github/workflows/fuzzing.yml"]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alvo: [cabecalho, linha_de_comando, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust nightly e cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: Fuzzing de ${{ matrix.alvo }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.alvo }} -- -max_total_time=120

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: caso-${{ matrix.alvo }}
          path: fuzz/artifacts/${{ matrix.alvo }}
