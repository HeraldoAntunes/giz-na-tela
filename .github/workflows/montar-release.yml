# Monta o programa, o instalador e o zip portátil a partir do código público, nos computadores do GitHub (não no PC
# do mantenedor): qualquer pessoa pode conferir de onde saiu cada arquivo. Só roda pelo botão "Run workflow",
# informando a tag ou o branch. Não publica nada: os arquivos ficam como artefato do workflow por 14 dias.
name: Montar release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branch a montar (ex.: v1.0.0 ou main)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: montar-${{ inputs.ref }}

jobs:
  montar:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Montar o programa, o instalador e o zip portátil (com os testes)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Guardar os arquivos montados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: giz-na-tela-${{ github.run_number }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
